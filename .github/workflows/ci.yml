name: ci

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    # Re-check main at least daily so main-health sees a fresh result even when
    # nothing is pushed.
    - cron: '41 5 * * *'
  workflow_dispatch:

jobs:
  kani:
    name: Kani pure-kernel proofs (with vacuity gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Install exactly the version pinned in formal/run-kani.sh. Do not run
      # bare `cargo kani` on the whole crate: it would try to build wasmtime,
      # which fails Kani 0.67's rustc-1.93 MSRV check; run-kani.sh passes
      # `--no-default-features` per harness.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-kani
            ~/.cargo/bin/kani
            ~/.kani
            ~/.rustup/toolchains/nightly-2025-11-21-*
          key: kani-0.67.0-nightly-2025-11-21-${{ runner.os }}
      - name: install pinned Kani
        run: |
          if ! cargo kani --version 2>/dev/null | grep -q ' 0.67.0$'; then
            cargo install --locked kani-verifier@0.67.0
          fi
          # Always run setup: ~/.kani holds a toolchain link into ~/.rustup, so a
          # restored cache with a missing toolchain directory must be repaired.
          cargo kani setup
      - run: bash formal/run-kani.sh

  lean:
    name: Lean critical-boundary proofs (no sorry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          lake-package-directory: formal/lean
          auto-config: false
          build: true
          build-args: --wfail
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: true
      - name: independently check Lean declarations with pinned nanoda
        working-directory: formal/lean
        run: bash ./check-nanoda.sh

  rust:
    name: build + test + clippy (zero-warning gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Rust version is pinned in rust-toolchain.toml (1.95.0 + clippy/rustfmt). cargo honors that file
      # regardless of which toolchain this action installs, so local builds and CI share ONE source of truth.
      # The zero-warning clippy gate below therefore always runs under 1.95.0. Bump it there, not here
      # (mirrors averin/.github/workflows/ci.yml). components: is a belt-and-suspenders pre-install.
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --locked
      - run: bash formal/check-refinement.sh
      - run: cargo test --locked
      # `delegate_approval_integration` (tenant-equality, D3 PEP floors,
      # approver_kind outbox, signed webhook) requires `mock-govder` and is
      # invisible to a plain `cargo test` (default features are empty, and the
      # feature is deliberately NOT default — the src-side mock evaluator must
      # stay out of production builds, see src/delegation/mod.rs). Both
      # invocations are required; this is the only gate that runs the second one.
      - run: cargo test --locked --features mock-govder
      # The lib tests again without default features (no wasm-plugins). This is
      # the build Kani and the formal detectors use; a test that only holds with
      # the WASM runtime compiled in failed here unnoticed until this step
      # existed (plugins::installer, found 2026-10-09).
      - run: cargo test --locked --no-default-features --lib
      # Zero clippy warnings is a repo convention; -D warnings makes it a hard gate.
      - run: cargo clippy --locked --all-targets -- -D warnings
      # ...and the same gate over the feature-gated targets, which the line above does NOT
      # compile. `tests/delegate_approval_integration.rs` only exists under `mock-govder`, so
      # a lint regression in it was invisible to the "zero-warning gate" — measured
      # 2026-07-27: the default invocation was clean while --all-features still had a
      # clippy::type_complexity error. A gate that skips a third of the test tree is the
      # inert-gate class this repo keeps finding.
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit

  formal-fast:
    name: formal register and fast mutants
    runs-on: ubuntu-latest
    # About 20 minutes with a warm cache; a cold dependency build (a Cargo.lock
    # change, or a new cache key) adds several minutes. 30 was hit on main on
    # 2026-10-08 (issue #47).
    timeout-minutes: 60
    env:
      # One target dir under the workspace so rust-cache keeps the dependency
      # build; the mutant scratch worktree reuses it through --cargo-target-dir
      # (kit v2 ignores the caller's CARGO_TARGET_DIR otherwise).
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      # No debug info: smaller objects and faster links for every mutant build.
      CARGO_PROFILE_DEV_DEBUG: "0"
      # Print the kit's baseline lines as they happen (per-mutant results come
      # at the end), so a timeout still shows how far the run got.
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: kit unit tests
        run: python3 -m unittest discover -s scripts/formal/tests
      - name: claims register checks
        run: python3 scripts/formal/check_claims.py
      - name: golden vector pins (vectors.lock)
        run: python3 scripts/vectors/check_vectors_lock.py
      # The outbox-signature vectors come from an independent Python reference; the committed file
      # must be exactly what the generator prints.
      - name: outbox-signature vector generator reproduces the committed file
        run: python3 scripts/vectors/gen_outbox_signature.py | cmp - vectors/outbox-signature.v1.json
      - name: fast-tier mutants must be killed
        env:
          # Each mutant changes one function of the vultrino crate; incremental
          # compilation rebuilds only what changed. Dependencies come from the
          # cache either way.
          CARGO_INCREMENTAL: "1"
        run: python3 scripts/formal/check_mutants.py --tier fast --cargo-target-dir "$CARGO_TARGET_DIR" --json formal-fast.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: formal-fast-report
          path: formal-fast.json
          if-no-files-found: ignore
          retention-days: 14

  formal-nightly:
    name: formal full-tier mutants (scheduled)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_PROFILE_DEV_DEBUG: "0"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-kani
            ~/.cargo/bin/kani
            ~/.kani
            ~/.rustup/toolchains/nightly-2025-11-21-*
          key: kani-0.67.0-nightly-2025-11-21-${{ runner.os }}
      - name: install pinned Kani
        run: |
          if ! cargo kani --version 2>/dev/null | grep -q ' 0.67.0$'; then
            cargo install --locked kani-verifier@0.67.0
          fi
          cargo kani setup
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          lake-package-directory: formal/lean
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
      - name: all mutants must be killed
        env:
          CARGO_INCREMENTAL: "1"
        run: python3 scripts/formal/check_mutants.py --tier full --timeout 1500 --cargo-target-dir "$CARGO_TARGET_DIR" --json formal-full.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: formal-full-report
          path: formal-full.json
          if-no-files-found: ignore
          retention-days: 90

  iana-snapshot-drift:
    name: IANA special-purpose registry snapshots match the live files (scheduled)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The SSRF classifier spec is transcribed from the CSV snapshots under
      # formal/vectors/. A registry change fails this job (and so the scheduled
      # run, which main-health reports); the tables are then refreshed by hand.
      - name: compare committed CSV snapshots byte for byte with IANA
        run: bash formal/vectors/check-iana-drift.sh

  ci-required:
    name: ci-required
    if: always()
    needs: [kani, lean, rust, audit, formal-fast]
    runs-on: ubuntu-latest
    steps:
      - name: every required job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success")'
