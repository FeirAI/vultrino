name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  rust:
    name: build + test + clippy (zero-warning gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The Rust version is pinned in rust-toolchain.toml (1.92.0 + clippy/rustfmt). cargo honors that file
      # regardless of which toolchain this action installs, so local builds and CI share ONE source of truth.
      # The zero-warning clippy gate below therefore always runs under 1.92.0. Bump it there, not here
      # (mirrors averin/.github/workflows/ci.yml). components: is a belt-and-suspenders pre-install.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo build
      - run: cargo test
      # Zero clippy warnings is a repo convention; -D warnings makes it a hard gate.
      - run: cargo clippy --all-targets -- -D warnings
